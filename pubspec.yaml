name: staki_mobile
description: "Staki Fund - Credit Passport mobile app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  cloud_firestore: ^5.0.1
  cupertino_icons: ^1.0.6
  file_picker: ^8.0.5
